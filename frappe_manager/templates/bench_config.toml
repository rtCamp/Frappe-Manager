# Denotes the bench name.
# Should not be edited by user.
name = "fm.com"

# Enables Frappe developer mode for the bench.
developer_mode = false

# Enables admin tools (e.g., Mailpit and Adminer) for the bench.
admin_tools = false

# Sets the bench environment to either "prod" (production) or "dev" (development).
environment_type = "prod"

# SSL certificates configuration
# Certificates are managed via: fm ssl add <bench> <domain>
# Let's Encrypt discontinued email notifications in June 2025
#
# Example SSL certificate configuration:
# [[ssl_certificates]]
# domain = "fm.com"
# ssl_type = "letsencrypt"
# challenge_type = "http01"
# acme_client = "acme.sh"
# hsts = "off"

# (Optional) Additional domains (aliases) for the bench.
# These domains will be served by the bench but require separate SSL certificates.
# Example: alias_domains = ["www.fm.com", "api.fm.com"]
# Note: Wildcard domains (e.g., "*.fm.com") require dns01 challenge.
# alias_domains = []
