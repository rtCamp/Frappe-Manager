[project]
site_name        = "Frappe Manager"
site_description = "Documentation for Frappe Manager: simple local Frappe development and deployment"
site_url         = "https://opensource.rtcamp.com/Frappe-Manager/"
repo_name        = "rtcamp/frappe-manager"
repo_url         = "https://github.com/rtcamp/frappe-manager"
edit_uri         = "edit/main/docs/"
extra_css        = ["stylesheets/extra.css"]

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------
nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    "getting-started/index.md",
    { "Installation"      = "getting-started/installation.md" },
    { "Your first bench"  = "getting-started/quick-start.md" },
  ]},
  { "Concepts" = [
    "concepts/index.md",
    { "Runtimes: mount vs image"      = "concepts/runtimes.md" },
    { "Environments: dev vs prod"     = "concepts/environments.md" },
    { "Web serving and concurrency"   = "concepts/web-serving.md" },
    { "Background jobs and workers"   = "concepts/background-jobs.md" },
  ]},
  { "Guides" = [
    "guides/index.md",
    { "App management"          = "guides/app-management.md" },
    { "Python and Node versions" = "guides/python-node-versions.md" },
    { "VS Code integration"     = "guides/vscode.md" },
    { "Admin tools"             = "guides/admin-tools.md" },
    { "fmx: in-container services" = "guides/fmx.md" },
    { "Domains and remote access" = "guides/domains.md" },
    { "HTTPS certificates"      = "guides/ssl.md" },
    { "Hosting on a server"     = "guides/hosting.md" },
    { "Backup and restore"      = "guides/backup-restore.md" },
    { "External database"       = "guides/external-database.md" },
  ]},
  { "Deployment" = [
    "deploy/index.md",
    { "Rollback"                = "deploy/rollback.md" },
    { "Transports and platforms" = "deploy/transports.md" },
  ]},
  { "Commands" = [
    "commands/index.md",
    { "fm create"   = "commands/create.md" },
    { "fm start"    = "commands/start.md" },
    { "fm stop"     = "commands/stop.md" },
    { "fm restart"  = "commands/restart.md" },
    { "fm delete"   = "commands/delete.md" },
    { "fm reset"    = "commands/reset.md" },
    { "fm list"     = "commands/list.md" },
    { "fm info"     = "commands/info.md" },
    { "fm shell"    = "commands/shell.md" },
    { "fm code"     = "commands/code.md" },
    { "fm logs"     = "commands/logs.md" },
    { "fm compose"  = "commands/compose.md" },
    { "fm update"     = "commands/update.md" },
    { "fm apps"       = "commands/apps.md" },
    { "fm domain"     = "commands/domain.md" },
    { "fm tools"      = "commands/tools.md" },
    { "fm telemetry"  = "commands/telemetry.md" },
    { "fm ngrok"      = "commands/ngrok.md" },
    { "fm auth"        = "commands/auth.md" },
    { "fm maintenance" = "commands/maintenance.md" },
    { "fm ssl" = [
      "commands/ssl.md",
      { "fm ssl dns-config cloudflare" = "commands/ssl-dns-config-cloudflare.md" },
    ]},
    { "fm bake"     = "commands/bake.md" },
    { "fm switch"   = "commands/switch.md" },
    { "fm prune"    = "commands/prune.md" },
    { "fm services" = "commands/services.md" },
    { "fm migrate"  = "commands/migrate.md" },
    { "fm self"     = "commands/self.md" },
  ]},
  { "Reference" = [
    "reference/index.md",
    { "Configuration files" = "reference/configuration.md" },
    { "Logs and debugging"  = "reference/logs.md" },
    { "Migrations"          = "reference/migrations.md" },
    { "Migration history"   = "reference/migration-history.md" },
    { "Process locks"       = "reference/locks.md" },
    { "Architecture"        = "reference/architecture.md" },
  ]},
  { "FAQ"       = "faq.md" },
  { "Changelog" = "changelog.md" },
]

# ---------------------------------------------------------------------------
# Theme: rtCamp Brand Inspired
# ---------------------------------------------------------------------------
[project.theme]
variant  = "modern"
language = "en"
logo     = "assets/logo.png"
favicon  = "assets/logo.png"
font = { text = "Reddit Sans, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif", code = "JetBrains Mono, Consolas, Monaco, monospace" }
features = [
  # Navigation
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "navigation.tracking",
  # Search
  "search.highlight",
  "search.suggest",
  "search.share",
  # Content
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "content.action.edit",
  # TOC
  "toc.follow",
]

[project.theme.icon]
repo     = "fontawesome/brands/github"
edit     = "lucide/pencil"
previous = "lucide/chevron-left"
next     = "lucide/chevron-right"

# Light mode: rtCamp orange + purple accents
[[project.theme.palette]]
scheme      = "default"
primary     = "deep-orange"
accent      = "pink"

  [project.theme.palette.toggle]
  icon = "lucide/moon"
  name = "Switch to dark mode"

# Dark mode: rtCamp orange + purple accents  
[[project.theme.palette]]
scheme      = "slate"
primary     = "deep-orange"
accent      = "pink"

  [project.theme.palette.toggle]
  icon = "lucide/sun"
  name = "Switch to light mode"

# ---------------------------------------------------------------------------
# Social links
# ---------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/rtcamp/frappe-manager"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/frappe-manager/"
name = "PyPI"

# ---------------------------------------------------------------------------
# Versioning: powered by squidfunk/mike fork
# ---------------------------------------------------------------------------
[project.extra.version]
provider = "mike"
alias    = true   # shows "1.0 (latest)" in the selector
default  = "latest"  # "latest" is the stable version, suppresses warning banner
