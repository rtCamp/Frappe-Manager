[project]
site_name        = "Frappe Manager"
site_description = "Documentation for Frappe Manager — simple local Frappe development and deployment"
site_url         = "https://rtcamp.github.io/frappe-manager/"
repo_name        = "rtcamp/frappe-manager"
repo_url         = "https://github.com/rtcamp/frappe-manager"
edit_uri         = "edit/main/"

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------
nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    "getting-started/index.md",
    { "Installation"  = "getting-started/installation.md" },
    { "Requirements"  = "getting-started/requirements.md" },
    { "Quick Start"   = "getting-started/quick-start.md" },
  ]},
  { "Guides" = [
    "guides/index.md",
    { "Environments"          = "guides/environments.md" },
    { "SSL / HTTPS"           = "guides/ssl.md" },
    { "App Management"        = "guides/app-management.md" },
    { "Admin Tools"           = "guides/admin-tools.md" },
    { "VSCode Integration"    = "guides/vscode.md" },
    { "Windows / WSL"         = "guides/wsl.md" },
    { "External Database"     = "guides/external-database.md" },
    { "Upload Limits"         = "guides/upload-limits.md" },
    { "Google API Development"= "guides/google-api.md" },
  ]},
  { "Commands" = [
    "commands/index.md",
    { "fm create"   = "commands/create.md" },
    { "fm start"    = "commands/start.md" },
    { "fm stop"     = "commands/stop.md" },
    { "fm restart"  = "commands/restart.md" },
    { "fm delete"   = "commands/delete.md" },
    { "fm list"     = "commands/list.md" },
    { "fm info"     = "commands/info.md" },
    { "fm logs"     = "commands/logs.md" },
    { "fm shell"    = "commands/shell.md" },
    { "fm code"     = "commands/code.md" },
    { "fm update"   = "commands/update.md" },
    { "fm reset"    = "commands/reset.md" },
    { "fm migrate"  = "commands/migrate.md" },
    { "fm ngrok"    = "commands/ngrok.md" },
    { "fm ssl"      = "commands/ssl.md" },
    { "fm services" = "commands/services.md" },
    { "fm self"     = "commands/self.md" },
  ]},
  { "Reference" = [
    "reference/index.md",
    { "Architecture"          = "reference/architecture.md" },
    { "Configuration Files"   = "reference/configuration.md" },
    { "Workers & Background Jobs" = "reference/workers.md" },
    { "Migrations"            = "reference/migrations.md" },
    { "Logs & Debugging"      = "reference/logs.md" },
  ]},
  { "FAQ"       = "faq.md" },
  { "Changelog" = "changelog.md" },
]

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
[project.theme]
language = "en"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.footer",
  "navigation.tracking",
  "search.highlight",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme  = "default"
primary = "deep-orange"
accent  = "orange"

  [project.theme.palette.toggle]
  icon = "lucide/moon"
  name = "Switch to dark mode"

[[project.theme.palette]]
scheme  = "slate"
primary = "deep-orange"
accent  = "orange"

  [project.theme.palette.toggle]
  icon = "lucide/sun"
  name = "Switch to light mode"

# ---------------------------------------------------------------------------
# Extra
# ---------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/rtcamp/frappe-manager"

# ---------------------------------------------------------------------------
# Markdown extensions
# (Zensical's defaults already include most of these; we only need to list
#  extensions that need non-default config or that aren't in the default set.)
# ---------------------------------------------------------------------------
[project.markdown_extensions]
admonition       = {}
attr_list        = {}
md_in_html       = {}
tables           = {}

[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.highlight"]

[project.markdown_extensions."pymdownx.inlinehilite"]

[project.markdown_extensions."pymdownx.superfences"]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true

[project.markdown_extensions."pymdownx.emoji"]
emoji_index     = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
