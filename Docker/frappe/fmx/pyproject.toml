[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fmx"
version = "1.1.0"
authors = [
  { name="fmx - fm container helper cli", email="sys@rtcamp.com" },
]
description = "A CLI tool to interact with supervisord instances managed by Frappe-Manager."
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.16.0",
    "rich>=13.0.0,<15.0.0",
    "supervisor>=4.2.0,<5.0.0",
    "redis>=6.1.1",
    "rq>=2.3.3",
    "typer-examples",
]

[project.urls]
"Homepage" = "https://github.com/rtCamp/Frappe-Manager"
"Repository" = "https://github.com/rtCamp/Frappe-Manager"
"Bug Tracker" = "https://github.com/rtCamp/Frappe-Manager/issues"

[project.scripts]
fmx = "fmx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fmx"]

[tool.uv]
package = true

[tool.uv.sources]
typer-examples = { git = "https://github.com/Xieyt/typer-examples", tag = "v1.0.0" }

[dependency-groups]
dev = [
    "nuitka>=2.7.12",
]
