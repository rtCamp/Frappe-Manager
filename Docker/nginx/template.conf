{# template/nginx #}
{# Input: JSON object {"site_map": {"domain": "site_name", ...}} #}
{# Example: {"site_map": {"alok.rt.gw": "alok.rt.gw", "gg.alok.rtmake.com": "alok.rt.gw"}} #}

{%- set all_domains = site_map.keys() | list %}

# Structured JSON access log, defined here because conf.d/*.conf is included at
# http context (log_format is not valid in a server block). Kept byte-identical
# to FM_JSON_LOG_FORMAT in frappe_manager/site_manager/modules/nginx_logging.py,
# which the global nginx-proxy consumes via its LOG_FORMAT env: one format at
# both hops, one ingestion pipeline. Upstream fields are quoted because nginx
# writes "-" or comma-lists there (a 503 with no upstream must stay valid JSON).
log_format fm_json escape=json '{"time":"$time_iso8601","request_id":"$request_id","client":"$remote_addr","xff":"$http_x_forwarded_for","host":"$host","scheme":"$scheme","method":"$request_method","path":"$request_uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream":"$upstream_addr","upstream_status":"$upstream_status","upstream_time":"$upstream_response_time","referer":"$http_referer","ua":"$http_user_agent"}';

map $host $frappe_site_name {
	default {{ site_map.values() | list | first }};
	{% for domain, site_name in site_map.items() %}
	{{ domain }} {{ site_name }};
	{% endfor %}
}

# Frappe reads this same Authorization header for its own API-key auth, so an fm
# basic auth prompt (`fm auth --protect web`) would make every authenticated request
# fail with AuthenticationError. Strip the header only for requests nginx itself
# authenticated ($remote_user set): an exempt path (--allow-path) or an allow-listed
# IP never authenticates here, so a real Frappe API key still passes through, and
# with no fm auth configured $remote_user is always empty (nothing changes).
map $remote_user $fm_upstream_auth {
	default $http_authorization;
	~.      "";
}

# Set Origin header for socketio: use client's Origin if present, otherwise construct from scheme + host
# This ensures Frappe's socketio always receives an Origin header for validation
map $http_origin $origin_header {
	default $http_origin;
	"" "http://$host";
}


upstream frappe-bench-frappe {
	# `frappe-site` = site-network-scoped alias (docker-compose.tmpl). The bare
	# service name `frappe` also resolves on the SHARED global-frontend-network,
	# where every bench's frappe carries it -- Docker DNS would round-robin
	# across benches. The alias exists only on this bench's site network.
	server frappe-site:80 fail_timeout=120;
}
upstream frappe-bench-socketio-server {
	server socketio-site:80 fail_timeout=120;
}
server {

	listen 80;
	listen [::]:80;

	server_name {{ ' '.join(all_domains) }};
	root /workspace/frappe-bench/sites;

	proxy_buffer_size 128k;
	proxy_buffers 4 256k;
	proxy_busy_buffers_size 256k;

	add_header X-Frame-Options "SAMEORIGIN";
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
	add_header X-Content-Type-Options nosniff;
	add_header X-XSS-Protection "1; mode=block";
	add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin";


	location /assets {
		# Serve baked/static assets when present (prod image, mount). When absent -- e.g.
		# a dev bench whose `bench watch` rebuilt bundles with fresh content-hashes that the
		# baked nginx image doesn't have -- fall through to the frappe web server, which
		# serves /assets itself in dev (application_with_statics). Content-hashed filenames
		# mean stale baked bundles are simply never requested.
		try_files $uri @webserver;
		add_header Cache-Control "max-age=31536000";
	}

	location ~ ^/protected/(.*) {
		internal;
		try_files /$host/$1 =404;
	}

	location /socket.io {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header X-Frappe-Site-Name $frappe_site_name;
		proxy_set_header Origin $origin_header;
		proxy_set_header Host $host;
		proxy_set_header Authorization $fm_upstream_auth;

		proxy_pass http://frappe-bench-socketio-server;
	}

	location / {

 		rewrite ^(.+)/$ $1 permanent;
  		rewrite ^(.+)/index\.html$ $1 permanent;
  		rewrite ^(.+)\.html$ $1 permanent;

		location ~* ^/files/.*.(htm|html|svg|xml) {
			add_header Content-disposition "attachment";
			try_files /$frappe_site_name/public/$uri @webserver;
		}

		try_files /$frappe_site_name/public/$uri @webserver;
	}

	location @webserver {
		proxy_http_version 1.1;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		proxy_set_header X-Frappe-Site-Name $frappe_site_name;
		proxy_set_header Host $host;
		proxy_set_header Authorization $fm_upstream_auth;
		proxy_read_timeout 120;
		proxy_redirect off;

		proxy_pass  http://frappe-bench-frappe;
	}

	# certbot webroot
	location ^~ /.well-known/acme-challenge/ {
		auth_basic off;
		auth_request off;
		allow all;
		root /usr/share/nginx/html;
		try_files $uri =404;
		break;
	}

	# error pages
	error_page 502 /502.html;
	location /502.html {
		root /config/templates;
		internal;
		types { }
		default_type application/json;
	}

	access_log  /var/log/nginx/access.log fm_json;
	error_log  /var/log/nginx/error.log;

	# optimizations
	sendfile on;
	keepalive_timeout 15;
	client_body_buffer_size 16K;
	client_header_buffer_size 1k;

	# enable gzip compresion
	# based on https://mattstauffer.co/blog/enabling-gzip-on-nginx-servers-including-laravel-forge
	gzip on;
	gzip_http_version 1.1;
	gzip_comp_level 5;
	gzip_min_length 256;
	gzip_proxied any;
	gzip_vary on;
	gzip_types
		application/atom+xml
		application/javascript
		application/json
		application/rss+xml
		application/vnd.ms-fontobject
		application/x-font-ttf
		application/font-woff
		application/x-web-app-manifest+json
		application/xhtml+xml
		application/xml
		font/opentype
		image/svg+xml
		image/x-icon
		text/css
		text/plain
		text/x-component
		;
		# text/html is always compressed by HttpGzipModule

	# include custom config
	include /etc/nginx/custom/*.conf;
}
