# bench_config.toml, every key fm reads, generated from the models by
# `just config-example`. Committed and drift-tested, so it cannot fall behind the schema.
#
# This is a REFERENCE, not a starting file: fm writes bench_config.toml itself when you run
# `fm create`. Everything below is commented out. Copy a line, uncomment it, set a value.
# Comments you add to a real bench_config.toml are preserved when fm saves it.
#
# fm's own bookkeeping tables are omitted: [migration_state] and [deploy_state] are written
# by fm and are not settings.

# ---- top-level keys ---------------------------------------------------------------------------

# The bench's primary domain, and the directory name under ~/frappe/sites. [required]
# name = ...
# Environment: dev or prod. Written as `environment`. [required]
# environment = ...
# Whether developer mode is enabled [required]
# developer_mode = ...
# Whether admin tools are enabled [required]
# admin_tools = ...
# Runtime: 'mount' (live-mounted code) or 'image' (immutable app image). Default 'mount'.
# [default: 'mount']
# runtime = ...
# App image repo (image runtime); fm manages the :tag. [optional, unset by default]
# image = ...
# Mount mode: override the base frappe image (repo:tag) for frappe/socketio/schedule/workers. None
# = default fm image. [optional, unset by default]
# base_image = ...
# Mount runtime: workspace was seeded from this baked image at create (extracted; no
# clone/install/build). Provenance record. [optional, unset by default]
# seed_image = ...
# Maximum upload size (e.g., '50M', '100M', '500M', '1G') [default: '50M']
# upload_limit = ...
# GitHub personal access token for private repositories [optional, unset by default]
# github_token = ...
# Python version requirement from frappe app (e.g., '>=3.10,<3.14') [optional, unset by default]
# python_version = ...
# Node version requirement from frappe app (e.g., '>=18') [optional, unset by default]
# node_version = ...
# Database name for this bench (auto-generated random string) [optional, unset by default]
# db_name = ...
# Docker Compose restart policy for all services in this bench [optional, unset by default]
# restart_policy = ...

# ---- [switch] ------------------------------------------------------------------------------

# Switch/migrate pipeline configuration ([switch]).
# [switch]
# Run bench migrate during switch. There is no 'detect whether it is needed' mode: a DocType field
# change ships with no patch and no version bump, so any such probe reports 'clean' while bench
# migrate would still sync the schema. [default: True]
# migrate = ...
# Seconds the one-shot bench migrate may run before it is killed (0 disables the budget).
# [default: 300]
# migrate_timeout = ...
# Custom migrate command override. [optional, unset by default]
# migrate_command = ...
# Show maintenance page during schema-changing steps. [default: True]
# maintenance_mode = ...
# Phases with maintenance page: 'migrate'. [] asserts a backward-compatible migration (no page).
# [default: ['migrate']]
# maintenance_mode_phases = ...
# Dump the DB (+ site-config snapshot) before the switch: true, false, or 'auto' (dump only when
# the deploy will run bench migrate). [default: True]
# backup_db = ...
# On failure: re-pin the previous image tag and recreate (code only, never touches the DB).
# [default: True]
# rollback_image = ...
# On failure: also restore the DB dump (requires backup_db; default off -- migrate is resumable).
# [default: False]
# rollback_db = ...
# Install new apps to the site during finalize. [default: True]
# install_apps = ...
# Releases `fm prune` keeps (history rows + dumps + local tags); current + previous are always
# safe. [default: 7]
# keep_releases = ...
# Keys to merge into common_site_config.json. [optional, unset by default]
# common_site_config = ...
# Keys to merge into site_config.json. [optional, unset by default]
# site_config = ...
#
# Switch hooks: container scripts + a nested ``host`` set.
# [switch.hooks]
# Before the container swap. [optional, unset by default]
# before_restart = ...
# After the swap (finalize). [optional, unset by default]
# after_restart = ...
# Before `bench migrate`. [optional, unset by default]
# before_migrate = ...
# After `bench migrate` -- runs on success AND failure (hook env: MIGRATE_STATUS=migrated|failed,
# full log at MIGRATE_LOG_FILE[_HOST]). [optional, unset by default]
# after_migrate = ...
#
# Switch-phase hooks for a single location (container or host).
# [switch.hooks.host]
# Before the container swap. [optional, unset by default]
# before_restart = ...
# After the swap (finalize). [optional, unset by default]
# after_restart = ...
# Before `bench migrate`. [optional, unset by default]
# before_migrate = ...
# After `bench migrate` -- runs on success AND failure (hook env: MIGRATE_STATUS=migrated|failed,
# full log at MIGRATE_LOG_FILE[_HOST]). [optional, unset by default]
# after_migrate = ...

# ---- [workers] -----------------------------------------------------------------------------

# Worker-care configuration for restart and switch ([workers]).
# [workers]
# Drain RQ workers (suspend + wait for in-flight jobs) before cycling them. [default: True]
# drain = ...
# Seconds to wait for in-flight jobs; restart and switch abort when exceeded. [default: 300]
# drain_timeout = ...
# Poll interval in seconds while draining. [default: 5]
# drain_poll = ...
# Skip idle workers that stop responding while draining. [default: True]
# skip_stale = ...
# Seconds an idle unresponsive worker may block the drain wait. [default: 15]
# stale_timeout = ...
# Seconds after SIGUSR1 before escalating to a supervisor stop (no-drain path). [default: 15]
# kill_timeout = ...
# Poll interval while waiting for a killed worker to exit. [default: 3.0]
# kill_poll = ...

# ---- [auth] --------------------------------------------------------------------------------

# HTTP basic auth configuration ([auth]).
# [auth]
# Basic auth username, shared by both surfaces. [default: 'admin']
# user = ...
# Basic auth password; generated on first enable when unset. [optional, unset by default]
# password = ...
# Prompt on the frappe + socketio surface (every path bar the admin tools). [default: False]
# web = ...
# Prompt on the admin tools paths (/adminer/, /mailpit/). [default: True]
# tools = ...
# Addresses/CIDRs that skip the prompt wherever auth applies (satisfy any). [optional, empty by
# default]
# allow_ips = ...
# Path prefixes served without a prompt; applies to the web surface. [optional, empty by default]
# allow_paths = ...

# ---- [build] -------------------------------------------------------------------------------

# Image build configuration for bake ([build]).
# [build]
# Base image for the runtime Dockerfile FROM. [optional, unset by default]
# base_image = ...
# App source: 'provision' (clone+install fresh, reproducible) or 'workspace' (snapshot the bench's
# on-disk workspace; bench mode only). [default: 'provision']
# source = ...
# Python version (uv) baked into the image. [optional, unset by default]
# python_version = ...
# Node version (fnm) baked into the image. [optional, unset by default]
# node_version = ...
# Target build platform (e.g. 'linux/amd64'). None = the build daemon's native arch. Cross-arch
# bakes run under emulation (needs binfmt/Rosetta). [optional, unset by default]
# platform = ...
# Push the built image to the registry. Overridden either way by `fm bake --push/--no-push`. A
# bake that does not push still loads the image into the local daemon, so a same-host `fm switch`
# needs no registry at all. [default: False]
# push = ...
# Extra host paths baked into the image: 'src' or 'src:dest' (dest relative to /workspace/frappe-
# bench). Applied after source; overrides existing files. [optional, empty by default]
# include = ...

# ---- [sites.<key>] -------------------------------------------------------------------------

# The Frappe sites this bench holds, keyed by site name ([sites."<site>"]). Exactly one entry
# today. Replaces the old [database."<site>"] table, whose contents now live at
# [sites."<site>".database].
# [sites.<key>]
#
# The database server one site lives on (`[sites."<site>".database]`).
# [sites.<key>.database]
# Database server hostname or IP. Any MariaDB; MySQL is not supported. [required]
# host = ...
# Database server port. [default: 3306]
# port = ...
# Schema (database) name for this site. [required]
# name = ...
# Login user for the schema; omitted means equal to name; must equal name on v15. [optional, unset
# by default]
# user = ...
# Host path to the CA bundle; required when the server enforces TLS. [optional, unset by default]
# ca = ...
# Verify the server certificate names the host dialled. Set false only for a certificate that
# cannot name it. [default: True]
# check_hostname = ...
# Extra hostnames this site is served on, besides its own name. A site's name IS its canonical
# domain; these are alternates for the same site. [optional, empty by default]
# alias_domains = ...

# ---- [redis] -------------------------------------------------------------------------------

# External redis for this bench ([redis]). Absent means fm starts and manages the per-bench redis
# containers.
# [redis]
# Redis URL for the framework cache (e.g. 'redis://r.example:6379/0'). [required]
# cache = ...
# Redis URL for the queue and realtime (e.g. 'redis://r.example:6379/1'). [required]
# queue = ...

# ---- [monitoring] --------------------------------------------------------------------------

# Observability integrations ([monitoring]).
# [monitoring]
#
# NewRelic APM settings (`[monitoring.newrelic]`).
# [monitoring.newrelic]
# Enable NewRelic APM monitoring for the web process. [default: False]
# enabled = ...
# NewRelic ingest license key. [optional, unset by default]
# license_key = ...

# ---- [ssl] -----------------------------------------------------------------------------------

# DNS-01 credential sets, keyed by a free-form label. The set labelled 'cloudflare' is the default
# a certificate gets when it names no label. The same table exists in ~/frappe/fm_config.toml for
# credentials shared by every bench.
# A labelled set of DNS provider credentials for the DNS-01 challenge.
# [ssl.dns_providers.<label>]
# DNS provider this credential set is for. [default: 'cloudflare']
# provider = ...
# DNS provider account email (if required). [optional, unset by default]
# email = ...
# DNS provider API Token. [optional, unset by default]
# api_token = ...
# DNS provider API Key. [optional, unset by default]
# api_key = ...
#
# One entry per domain, written by `fm ssl add`. A certificate never holds a credential; it names
# one with dns_provider.
# [[ssl.certificates]]
# Hostname this certificate covers. [required]
# domain = ...
# Always 'letsencrypt' for this variant. [default: 'letsencrypt']
# ssl_type = ...
# ACME validation method: 'http01' serves a file over HTTP, 'dns01' writes a DNS record and needs
# a credential set. [default: 'http01']
# challenge_type = ...
# Whether this certificate participates in issuance. [default: True]
# enabled = ...
# Strict-Transport-Security value the proxy sends, or 'off'. [default: 'off']
# hsts = ...
# ACME client used for issuance. [default: 'acme.sh']
# acme_client = ...
# Label of the `[ssl.dns_providers]` credential set that authenticates this domain's DNS-01
# challenge. Absent means the set labelled 'cloudflare'. [optional, unset by default]
# dns_provider = ...
# Zone that _acme-challenge is delegated to, passed to acme.sh as --challenge-alias. Set by `fm
# ssl add --cname`. [optional, unset by default]
# delegation_cname = ...

# ---- [[apps]] ---------------------------------------------------------------------------------

# Apps installed in this bench, in install order. fm READS this array but never writes it: the
# list it maintains comes from the container. `fm create --config` and `fm bake --config` supply
# it, and a copy persisted here is preserved across saves rather than pruned.
# [[apps]]
# App name (e.g., 'erpnext') [required]
# name = ...
# GitHub repo (e.g., 'frappe/erpnext') [required]
# repo = ...
# Branch, tag, or commit SHA [optional, unset by default]
# ref = ...
# Full repo URL (auto-generated) [optional, unset by default]
# repo_url = ...
# Use shallow clone (depth=1) [default: True]
# shallow_clone = ...
# Subdirectory path for monorepo apps [optional, unset by default]
# subdir_path = ...
# Use symlink for subdirectory apps [default: False]
# symlink = ...
#
# Per-app build hooks: container scripts + a nested ``host`` set.
# [apps.hooks]
# Before this app's dependency install (uv pip install -e). [optional, unset by default]
# before_deps = ...
# After this app's dependency install. [optional, unset by default]
# after_deps = ...
# Before this app's `bench build --app`. [optional, unset by default]
# before_build = ...
# After this app's `bench build --app`. [optional, unset by default]
# after_build = ...
#
# Per-app build hooks for a single location (container or host).
# [apps.hooks.host]
# Before this app's dependency install (uv pip install -e). [optional, unset by default]
# before_deps = ...
# After this app's dependency install. [optional, unset by default]
# after_deps = ...
# Before this app's `bench build --app`. [optional, unset by default]
# before_build = ...
# After this app's `bench build --app`. [optional, unset by default]
# after_build = ...
