name: Tag on Release Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create and push tag
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          VERSION=$(echo "$HEAD_REF" | sed 's|^release/||')

          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: branch '$HEAD_REF' does not match release/vX.Y.Z — aborting."
            exit 1
          fi

          git tag "$VERSION"
          git push origin "$VERSION"

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Build
        run: uv build

      - name: Extract release notes from changelog
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 scripts/release_notes.py "$(echo "$HEAD_REF" | sed 's|^release/||')" > release-notes.md

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          VERSION=$(echo "$HEAD_REF" | sed 's|^release/||')
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            --verify-tag \
            --draft \
            dist/*
