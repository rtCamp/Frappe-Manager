name: Update CLI Documentation

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frappe_manager/commands/**/*.py'
      - 'scripts/update_cli_docs.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Generate CLI documentation
        run: |
          python scripts/update_cli_docs.py --output-dir docs

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/commands/
          git diff --staged --quiet || (git commit -m "docs: update CLI command reference from ${{ github.sha }}" && git push)
