name: Update CLI Documentation

on:
  workflow_dispatch:
    inputs:
      wiki_branch:
        description: 'Wiki branch to update'
        required: true
        default: 'main'
        type: string
  push:
    branches:
      - main
      - develop
    paths:
      - 'frappe_manager/commands/**/*.py'
      - 'frappe_manager/utils/examples.json'
      - 'scripts/update_cli_docs.py'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'frappe_manager/commands/**/*.py'
      - 'frappe_manager/utils/examples.json'
      - 'scripts/update_cli_docs.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup wiki branch
        run: |
          cd wiki
          # Get the branch name: use input if workflow_dispatch, otherwise use current branch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH_NAME="${{ inputs.wiki_branch }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          
          echo "Target wiki branch: $BRANCH_NAME"
          
          # Check if branch exists in wiki
          git fetch origin
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            # Branch exists, check it out
            git checkout "$BRANCH_NAME"
            git pull origin "$BRANCH_NAME"
          else
            # Branch doesn't exist, create it
            git checkout -b "$BRANCH_NAME"
          fi
          
          # Export for use in later steps
          echo "WIKI_BRANCH=$BRANCH_NAME" >> $GITHUB_ENV
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
      
      - name: Generate CLI documentation
        run: |
          python scripts/update_cli_docs.py
        env:
          WIKI_DIR: ${{ github.workspace }}/wiki
      
      - name: Check for changes
        id: check_changes
        run: |
          cd wiki
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push to wiki
        if: steps.check_changes.outputs.changes == 'true' && github.event_name != 'pull_request'
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add commands/
          git commit -m "docs: update CLI documentation from ${{ github.sha }} (branch: $WIKI_BRANCH)"
          git push origin "$WIKI_BRANCH"
      
      - name: Comment on PR with documentation preview
        if: steps.check_changes.outputs.changes == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const commandsDir = path.join(process.env.GITHUB_WORKSPACE, 'wiki', 'commands');
            const files = fs.readdirSync(commandsDir).filter(f => f.endsWith('.md'));
            
            let comment = '## 📚 CLI Documentation Updated\n\n';
            comment += `This PR updates CLI documentation for ${files.length} command(s).\n\n`;
            comment += '### Changed Files:\n';
            
            for (const file of files.slice(0, 10)) {
              comment += `- \`${file}\`\n`;
            }
            
            if (files.length > 10) {
              comment += `- ... and ${files.length - 10} more\n`;
            }
            
            comment += '\n> ⚠️ Documentation will be automatically pushed to wiki **`' + process.env.WIKI_BRANCH + '`** branch after merge.\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Upload documentation as artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cli-documentation
          path: wiki/commands/
          retention-days: 7
