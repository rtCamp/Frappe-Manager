name: Deploy Documentation

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'frappe_manager/**'
      - 'scripts/update_cli_docs.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --no-dev
      - name: Generate command reference docs
        run: uv run python scripts/update_cli_docs.py
      - name: Install Zensical and mike
        run: uv pip install --system zensical "git+https://github.com/squidfunk/mike.git"
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Resolve version slug from __about__.py
        id: ver
        run: |
          full=$(python -c "from frappe_manager.__about__ import __version__; print(__version__)")
          slug=$(python -c "
          import re, sys
          v = '$full'
          m = re.match(r'^(\d+\.\d+)', v)
          print('v' + m.group(1) if m else v)
          ")
          echo "full=$full" >> $GITHUB_OUTPUT
          echo "slug=$slug" >> $GITHUB_OUTPUT
      - name: Deploy versioned docs (release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: mike deploy --push --update-aliases ${{ steps.ver.outputs.slug }} latest -F zensical.toml
      - name: Deploy dev docs (develop branch)
        if: github.ref == 'refs/heads/develop'
        run: mike deploy --push dev -F zensical.toml
      - name: Deploy next docs (main branch)
        if: github.ref == 'refs/heads/main'
        run: mike deploy --push next -F zensical.toml
