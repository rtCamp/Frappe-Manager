name: Unit Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        # Both supported versions: requires-python allows 3.13 and 3.14, so a dependency that
        # breaks on either has to fail here rather than in a user's install.
        python-ver: ["3.13", "3.14"]
        os: [ubuntu-latest]
    
    steps:
      # The changelog gate walks history back to the last tag; a shallow clone has neither the
      # commits nor the tags, and would fail it with "cannot resolve".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-ver }}
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: |
          uv sync --group dev
      
      # The coverage floor lives HERE, not in pyproject, because this is the only place the whole
      # suite runs. A floor in the shared config fails every subset run a developer makes locally.
      # Ratchet it upwards as coverage climbs; never lower it to make a red build green.
      - name: Run pytest
        run: |
          uv run pytest tests/ -v --cov=frappe_manager --cov-report=xml --cov-report=term-missing --cov-fail-under=44

      # Reads the flag set from the live CLI, so it fails when code and docs disagree:
      # a renamed or removed flag still named in prose, a link to a page a deleted
      # command used to generate. That makes it a code check, not just a prose check.
      - name: Check docs against the CLI
        run: |
          uv run python scripts/docslint.py

      # The always-on channel reached 653 lines one commit at a time while -v sat at 23.
      # Four counts that may only fall; a line in the wrong shape has to displace an old one.
      - name: Check the shape of operator output
        run: |
          uv run python scripts/outputlint.py

      # Fires on the commit, where writing the entry is cheap. The v1.0.0 cycle shipped 289
      # commits with zero changelog entries and nobody noticed for three weeks.
      - name: Check every commit has a changelog entry
        run: |
          uv run python scripts/changelog_check.py
      
      - name: Upload coverage to Codecov
        if: matrix.python-ver == '3.13'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Builds the wheel and runs the installed fm on a case-insensitive filesystem. The Linux jobs
  # above cannot see a case collision inside the wheel at all: `frappe_manager/Docker` and the
  # `frappe_manager/docker` package coexisted there and merged into one directory on macOS,
  # making fm unimportable on every Mac install while CI stayed green.
  macos-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build and run the wheel
        run: |
          uv build --wheel -o dist
          uv venv /tmp/fmvenv
          uv pip install --python /tmp/fmvenv/bin/python dist/*.whl
          cd /tmp && /tmp/fmvenv/bin/fm --version

      # The wheel's own dependencies, nothing else. `import click` sat in commands/gating.py while
      # nothing declared click: typer 0.27 dropped it, and the import only resolved in a developer
      # venv because the docs tool happened to pull click in. Every local run, the whole suite and
      # both lints passed; the first user command raised ModuleNotFoundError.
      - name: No dev-only package satisfies a runtime import
        run: |
          cd /tmp && /tmp/fmvenv/bin/python -c "
          import importlib.util
          assert importlib.util.find_spec('click') is None, 'click present: this check would prove nothing'
          import frappe_manager.commands.gating
          import frappe_manager.main
          "

      # `fm bake` reads its Dockerfiles out of the package, which is the lookup the rename touched.
      - name: Packaged build context is reachable
        run: |
          cd /tmp && /tmp/fmvenv/bin/python -c "
          from frappe_manager.site_manager.modules.bake import BakeManager
          d = BakeManager._packaged_docker_dir()
          assert (d / 'frappe' / 'runtime.Dockerfile').exists(), d
          assert (d / 'nginx' / 'Dockerfile').exists(), d
          import frappe_manager.docker.docker_client
          "
