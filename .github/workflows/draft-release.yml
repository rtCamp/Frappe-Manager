name: Draft Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          if ! echo "${GITHUB_REF_NAME}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: tag '${GITHUB_REF_NAME}' does not match vX.Y.Z (e.g. v0.19.0)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.1

      - name: Run tests
        run: uv run --frozen pytest tests/ -v --cov=frappe_manager

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.1

      - name: Build
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  draft-release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract release notes from changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 -c "
          import re, sys
          with open('docs/changelog.md') as f:
              content = f.read()
          pattern = rf'(## v{re.escape(sys.argv[1])}.*?)(?=\n## v|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          print(match.group(1).strip() if match else f'Release {sys.argv[1]}')
          " "$VERSION" > release-notes.md

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag \
            --draft \
            dist/*
