name: Draft Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          if ! echo "${GITHUB_REF_NAME}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: tag '${GITHUB_REF_NAME}' does not match vX.Y.Z (e.g. v0.19.0)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Run tests
        run: uv run --frozen pytest tests/ -v --cov=frappe_manager

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Build
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  draft-release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # The tag drives the package version and the published image tag.
      - name: Verify version matches tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DECLARED=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' frappe_manager/__about__.py)
          if [ "$DECLARED" != "$VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match frappe_manager/__about__.py ($DECLARED)"
            exit 1
          fi

      - name: Extract release notes from changelog
        run: python3 scripts/release_notes.py "${GITHUB_REF_NAME#v}" --output release-notes.md

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag \
            --draft \
            dist/*
