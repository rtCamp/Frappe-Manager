version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/Docker/frappe"
    schedule:
      interval: "monthly"
  - package-ecosystem: "docker"
    directory: "/Docker/nginx"
    schedule:
      interval: "monthly"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "uv"
    directory: "/Docker/frappe/fmx"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
